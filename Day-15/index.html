<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Calculator Font -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
    <style>
        body{
            font-family: 'Orbitron', sans-serif;
            background:#111827;
        }

        button{
            transition:all .2s ease;
        }

        button:hover{
            transform:translateY(-2px);
            filter:brightness(1.08);
        }

        button:active{
            transform:scale(.95);
        }

        #display{
            font-family:'Orbitron',sans-serif;
            letter-spacing:2px;
        }
    </style>
</head>

<body class="bg-gray-900 flex justify-center items-center min-h-screen">

    <!-- Calculator -->
    <div class="bg-gray-800 p-6 rounded-3xl shadow-2xl border border-gray-700 w-80">

        <!-- Display -->
        <input
            type="text"
            id="display"
            readonly
            placeholder="0"
            class="w-full h-24 bg-black text-white text-5xl text-right rounded-2xl px-4 mb-5 outline-none border border-gray-700 shadow-inner"
        >

        <!-- Buttons -->
        <div class="grid grid-cols-4 gap-3">

            <button class="bg-gray-700 text-white py-4 rounded-xl text-xl font-bold shadow-lg">AC</button>
            <button class="bg-red-600 text-white py-4 rounded-xl text-xl font-bold shadow-lg">DEL</button>
            <button class="bg-orange-500 text-white py-4 rounded-xl text-xl font-bold shadow-lg">%</button>
            <button class="bg-orange-500 text-white py-4 rounded-xl text-xl font-bold shadow-lg">÷</button>

            <button class="bg-gray-200 text-gray-900 py-4 rounded-xl text-xl font-bold shadow-lg">7</button>
            <button class="bg-gray-200 text-gray-900 py-4 rounded-xl text-xl font-bold shadow-lg">8</button>
            <button class="bg-gray-200 text-gray-900 py-4 rounded-xl text-xl font-bold shadow-lg">9</button>
            <button class="bg-orange-500 text-white py-4 rounded-xl text-xl font-bold shadow-lg">×</button>

            <button class="bg-gray-200 text-gray-900 py-4 rounded-xl text-xl font-bold shadow-lg">4</button>
            <button class="bg-gray-200 text-gray-900 py-4 rounded-xl text-xl font-bold shadow-lg">5</button>
            <button class="bg-gray-200 text-gray-900 py-4 rounded-xl text-xl font-bold shadow-lg">6</button>
            <button class="bg-orange-500 text-white py-4 rounded-xl text-xl font-bold shadow-lg">−</button>

            <button class="bg-gray-200 text-gray-900 py-4 rounded-xl text-xl font-bold shadow-lg">1</button>
            <button class="bg-gray-200 text-gray-900 py-4 rounded-xl text-xl font-bold shadow-lg">2</button>
            <button class="bg-gray-200 text-gray-900 py-4 rounded-xl text-xl font-bold shadow-lg">3</button>
            <button class="bg-orange-500 text-white py-4 rounded-xl text-xl font-bold shadow-lg">+</button>

            <button class="bg-gray-200 text-gray-900 py-4 rounded-xl text-xl font-bold shadow-lg col-span-2">0</button>
            <button class="bg-gray-200 text-gray-900 py-4 rounded-xl text-xl font-bold shadow-lg">.</button>
            <button class="bg-green-600 text-white py-4 rounded-xl text-xl font-bold shadow-lg">=</button>

        </div>

    </div>

    <script src="calculator.js"></script>

</body>
</html>
