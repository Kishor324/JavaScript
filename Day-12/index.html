<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Form</title>

  <style>
   * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  background: #0f0f0f;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  width: 420px;
  background: #1b1b1b;
  padding: 25px;
  border-radius: 12px;
  border: 1px solid #2d2d2d;
  box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
}

h2 {
  text-align: center;
  margin-bottom: 25px;
  color: #ffffff;
  letter-spacing: 1px;
}

.form-group {
  margin-bottom: 18px;
}

label {
  display: block;
  margin-bottom: 8px;
  color: #d1d1d1;
  font-weight: bold;
}

input,
textarea {
  width: 100%;
  padding: 12px;
  background: #2a2a2a;
  color: #ffffff;
  border: 1px solid #444;
  border-radius: 8px;
  outline: none;
  font-size: 15px;
  transition: 0.3s;
}

input::placeholder,
textarea::placeholder {
  color: #888;
}

input:focus,
textarea:focus {
  border-color: #00bfff;
  box-shadow: 0 0 8px rgba(0, 191, 255, 0.5);
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 12px;
  background: #00bfff;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #0099cc;
  transform: translateY(-2px);
}

button:active {
  transform: scale(0.98);
}
  </style>
</head>

<body>

<div class="container">
  <h2> Add User</h2>

  <form>
    <div class="form-group">
      <label for="name">Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your name"
      >
    </div>

    <div class="form-group">
      <label for="role">Role</label>
      <input
        type="text"
        id="role"
        placeholder="Frontend Developer"
      >
    </div>

    <div class="form-froup">
      <label for="bio">Bio</label>
      <textarea
        id="bio"
        placeholder="Write something about yourself..."
      ></textarea>
    </div>

    <div class="form-group">
      <label for="photo">Photo URL</label>
      <input
        type="url"
        id="photo"
        placeholder="url"
      >
    </div>

    <button type="submit">Submit</button>
  </form>
</div>
<script src="script.js"></script>
</body>
</html>
